name: Run leads processor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      max_leads:
        description: "Max leads to process this run."
        required: false
        default: "50"
      dry_run:
        description: "Dry run (LLM runs, no Airtable / Gmail writes)."
        type: boolean
        required: false
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: cole-leads-processor
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pipeline
        id: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          MAX_LEADS: ${{ github.event.inputs.max_leads || '50' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          # Build flags from inputs. Cron runs default: max 50, no dry-run.
          flags="--max-leads ${MAX_LEADS}"
          if [ "${DRY_RUN}" = "true" ]; then
            flags="${flags} --dry-run"
          fi
          # Capture the RunSummary JSON (last stdout block) for the step summary.
          python -m cole_leads.pipeline $flags | tee /tmp/run-summary.json

      - name: Job summary
        if: always()
        run: python scripts/post_actions_summary.py /tmp/run-summary.json >> "$GITHUB_STEP_SUMMARY"
